name: Preview premium redesign (keep production homepage)

on:
  push:
    branches:
      - feat/premium-redesign
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aqua-paradise-pages
  cancel-in-progress: false

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - name: Checkout production from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: feat/premium-redesign
          path: redesign

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build unchanged production site
        working-directory: production
        run: |
          npm ci
          npm run build

      - name: Build preview at /preview/
        working-directory: redesign
        env:
          VITE_BASE_PATH: /aqua-paradise-resort/preview/
        run: |
          npm ci
          npm run build

      - name: Place preview in a separate subdirectory
        run: |
          mkdir -p production/dist/preview
          cp -a redesign/dist/. production/dist/preview/

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist

      - name: Deploy production root and preview together
        id: deployment
        uses: actions/deploy-pages@v4
