name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout retro preview (PR #5)
        uses: actions/checkout@v4
        with:
          ref: feat/retro-tropical-hero
          path: retro

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install main site dependencies
        working-directory: site
        run: npm ci || npm install

      - name: Build main site
        working-directory: site
        run: npm run build

      - name: Install retro site dependencies
        working-directory: retro
        run: npm ci || npm install

      - name: Build retro preview with independent asset paths
        working-directory: retro
        run: npm run build -- --base=/aqua-paradise-resort/retro/

      - name: Combine sites into one Pages artifact
        run: |
          mkdir -p site/dist/retro
          cp -a retro/dist/. site/dist/retro/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site/dist'

      - name: Deploy both sites to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
