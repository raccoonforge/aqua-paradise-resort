name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feat/riviera-final-polish]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout existing preview
        uses: actions/checkout@v4
        with:
          ref: feat/retro-tropical-hero
          path: preview-source

      - name: Checkout Riviera polish preview
        uses: actions/checkout@v4
        with:
          ref: feat/riviera-final-polish
          path: riviera-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build main site
        working-directory: site
        run: |
          npm ci || npm install
          npm run build

      - name: Install and build existing preview
        working-directory: preview-source
        run: |
          npm ci || npm install
          npm run build -- --base=/aqua-paradise-resort/preview/

      - name: Install and build Riviera preview
        working-directory: riviera-source
        run: |
          npm ci || npm install
          npm run build -- --base=/aqua-paradise-resort/riviera-polish/

      - name: Combine all Pages artifacts
        run: |
          mkdir -p site/dist/preview site/dist/riviera-polish
          cp -a preview-source/dist/. site/dist/preview/
          cp -a riviera-source/dist/. site/dist/riviera-polish/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Retries of the same workflow run keep earlier artifacts. Give each
      # attempt a distinct name so deploy-pages never sees duplicates.
      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-attempt-${{ github.run_attempt }}
          path: ./site/dist

      # GitHub's artifact metadata API can lag behind upload finalization.
      # Check the artifact is visible and allow Pages to index it before deploy.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-attempt-${{ github.run_attempt }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT_NAME"; then
              echo "Pages artifact is listed; allowing deployment metadata to settle."
              sleep 15
              exit 0
            fi
            echo "Artifact not yet indexed (attempt $attempt/12)."
            sleep 10
          done
          echo "::error::Pages artifact did not become visible in time."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}
