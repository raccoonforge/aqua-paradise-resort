name: Deploy to GitHub Pages

on:
  push:
    branches: [ fix/riviera-header-polish ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      # Build preview from the current working branch without merging its design into main.
      - name: Checkout new preview (PR #5)
        uses: actions/checkout@v4
        with:
          ref: feat/retro-tropical-hero
          path: preview-source

      - name: Checkout design preview (header polish)
        uses: actions/checkout@v4
        with:
          ref: fix/riviera-header-polish
          path: design-preview-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install main site dependencies
        working-directory: site
        run: npm ci || npm install

      - name: Build main site
        working-directory: site
        run: npm run build

      - name: Install preview site dependencies
        working-directory: preview-source
        run: npm ci || npm install

      - name: Build preview with independent asset paths
        working-directory: preview-source
        run: npm run build -- --base=/aqua-paradise-resort/preview/

      - name: Install design preview dependencies
        working-directory: design-preview-source
        run: npm ci

      - name: Build independent design preview
        working-directory: design-preview-source
        run: npm run build -- --base=/aqua-paradise-resort/design-preview/

      - name: Combine sites into one Pages artifact
        run: |
          mkdir -p site/dist/preview
          cp -a preview-source/dist/. site/dist/preview/
          mkdir -p site/dist/design-preview
          cp -a design-preview-source/dist/. site/dist/design-preview/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site/dist'

      - name: Deploy main, legacy preview, and design preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
