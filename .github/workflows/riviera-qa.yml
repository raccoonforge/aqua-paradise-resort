name: Riviera polish browser QA

on:
  push:
    branches: [feat/riviera-final-polish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install packages
        run: |
          npm ci
          npm install --no-save playwright
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - name: Production build
        run: npm run build -- --base=/aqua-paradise-resort/riviera-polish/
      - name: Start production-like static server
        run: |
          mkdir -p .qa-site/aqua-paradise-resort/riviera-polish
          cp -a dist/. .qa-site/aqua-paradise-resort/riviera-polish/
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .qa-site > /tmp/apr-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/aqua-paradise-resort/riviera-polish/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/apr-preview.log
          exit 1
      - name: Browser QA and screenshots
        run: node scripts/qa-riviera.mjs
      - name: Upload Hero to About screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riviera-hero-about-screenshots
          path: |
            qa-output/riviera-polish/transition-1440-hero-about.png
            qa-output/riviera-polish/transition-768-hero-about.png
            qa-output/riviera-polish/transition-375-hero-about.png
          retention-days: 14
      - name: Upload About section screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riviera-about-screenshots
          path: qa-output/riviera-polish/about-*.png
          retention-days: 14
      - name: Upload desktop and individual world screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riviera-nine-worlds-desktop
          path: |
            qa-output/riviera-polish/worlds-1440.png
            qa-output/riviera-polish/worlds-1920.png
            qa-output/riviera-polish/worlds-slide-*.png
          retention-days: 14
      - name: Upload tablet and phone world screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riviera-nine-worlds-mobile
          path: |
            qa-output/riviera-polish/worlds-768.png
            qa-output/riviera-polish/worlds-375.png
            qa-output/riviera-polish/worlds-390.png
          retention-days: 14
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riviera-polish-visual-qa
          path: qa-output/riviera-polish/
          retention-days: 14
